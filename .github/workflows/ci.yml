# Push 게이트: 깨진 코드가 머지되지 않도록 Go 테스트와 프론트 빌드를 강제한다.
# 테스트는 이미 존재했지만 자동 실행이 없어 회귀가 그대로 들어오던 문제를 막는 목적.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 연속 푸시 시 이전 실행을 취소해 러너 낭비를 줄인다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod의 go 지시문을 단일 출처로 사용 — 버전을 한 곳에서만 관리한다.
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # lockfile 기준 재현 가능한 설치 — package.json의 ^범위가 CI에서 흔들리지 않게.
      - name: npm ci
        run: npm ci
      # tsconfig가 noEmit이라 빌드(vite)는 타입을 검사하지 않는다. 별도 타입체크로 보강.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
